# nginx reverse proxy
# routes frontend and backend traffic
# local domain: nginx-stack.test

# frontend upstream service
# docker service name → frontend
upstream frontend {
    server frontend:80;
}

# backend api upstream
# docker service name → backend
upstream backend {
    server backend:5000;
}

server {
    # nginx listens on port 80
    listen 80;

    # local development domain
    server_name nginx-stack.local;

    # api routes → backend service
    location /api {
        proxy_pass http://backend;

        # preserve client and request metadata
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # all remaining routes → frontend
    location / {
        proxy_pass http://frontend;

        # preserve request headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}