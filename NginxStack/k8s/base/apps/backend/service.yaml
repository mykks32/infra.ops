# Kubernetes API version
apiVersion: v1

# Resource type
kind: Service

# Service metadata
metadata:
  # Service name
  name: backend-service
  # Namespace where Service is created
  namespace: nginx-stack
  # Labels for organizing and selecting resources
  labels:
    app: nginx-stack-backend

# Service specification
spec:
  # ClusterIP — internal only, Ingress handles external traffic
  type: ClusterIP

  # Route traffic to pods with this label
  selector:
    app: nginx-stack-backend

  # Port configuration
  ports:
    - port: 80          # Exposed service port
      targetPort: 5000  # Container port