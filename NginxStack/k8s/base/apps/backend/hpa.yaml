# Kubernetes API version for HorizontalPodAutoscaler
apiVersion: autoscaling/v2

# Resource type
kind: HorizontalPodAutoscaler

# HPA metadata
metadata:
  # HPA name
  name: backend-hpa
  # Namespace where HPA is created
  namespace: nginx-stack
  # Labels for organizing and selecting resources
  labels:
    app: nginx-stack-backend

# HPA specification
spec:
  # Target deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment

  # Minimum number of replicas
  minReplicas: 2
  # Maximum number of replicas
  maxReplicas: 8

  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale up when average CPU exceeds 60%
          averageUtilization: 60
    # Scale on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Scale up when average memory exceeds 70%
          averageUtilization: 70

  behavior:
    scaleDown:
      # Wait 2 min before scaling down to avoid flapping
      stabilizationWindowSeconds: 120
    scaleUp:
      # Scale up fast when under load
      stabilizationWindowSeconds: 30