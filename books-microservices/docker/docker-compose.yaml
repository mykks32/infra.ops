name: book-infra

services:
  # PostgreSQL Database
  postgres_book:
    image: postgres:17
    container_name: postgres_book
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_book_data:/var/lib/postgresql/data
    networks:
      - book-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgAdmin
  pgadmin_book:
    image: dpage/pgadmin4
    container_name: pgadmin_book
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      postgres_book:
        condition: service_healthy
    networks:
      - book-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

